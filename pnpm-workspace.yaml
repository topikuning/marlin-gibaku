# Override transitif utk menutup advisory keamanan (CI: pnpm audit --prod --high):
#   sharp   — dedupe salinan next→sharp ke versi patched (libvips) yg sama dgn dep langsung
#   fast-uri — patch host-confusion (transitif Prisma), >=3.1.4
#   postcss — patch arbitrary file read via sourceMappingURL (transitif Next), >=8.5.12
#   brace-expansion@5 — patch DoS unbounded expansion (transitif exceljs→minimatch@10), GHSA-mh99-v99m-4gvg.
#     HANYA lini v5 yg di-bump ke >=5.0.8 (satu-satunya instance yg benar-benar rentan). Lini v1
#     (minimatch@3, mis. eslint) & v2 (minimatch@5) TAK boleh dipaksa ke v5: CJS build v5 memakai
#     named export → `expand is not a function` di minimatch@3 (rusak). Keduanya sudah patched di
#     lini masing2 (1.1.16 > 1.1.12, 2.1.2 > 2.0.2).
#   deepmerge-ts — patch stack exhaustion saat menggabungkan graf objek rekursif
#     (GHSA-ggr8-5vv4-36mx, <8.0.0). Transitif lewat @prisma/client→prisma→@prisma/config.
#     Lompatan MAYOR (7→8), jadi tidak boleh dianggap remeh: yang memakainya hanya
#     @prisma/config saat menggabungkan berkas konfigurasi Prisma, dan jalur itu
#     dilewati setiap `prisma generate`/`migrate`. Diverifikasi setelah override:
#     generate, migrate deploy, build, unit, dan integrasi semuanya hijau.
#   nanoid@3 — patch custom generator yg bisa berputar tanpa henti saat size 0
#     (GHSA-2v37-7h3g-55p8, <3.3.17). Transitif lewat postcss, yang dipakai Next,
#     Tailwind, DAN Vite sekaligus. Dinaikkan HANYA di lini v3 — rentang postcss
#     (^3.3.x) tetap terpenuhi, jadi tidak ada perubahan mayor yang diselundupkan.
#   browserslist — patch ReDoS lewat browserslist-stats.json tak tepercaya
#     (GHSA-73wf-gq98-2v4g, <=4.28.6). Transitif lewat next→styled-jsx→@babel/core;
#     tidak bisa dinaikkan lewat dependensi langsung mana pun.
#   mysql2 — patch auth-plugin downgrade ke mysql_clear_password yang membocorkan
#     kredensial polos (GHSA-3f6p-5ww8-9rcr, <3.22.0). Ditarik @prisma/client→prisma
#     karena Prisma mendukung banyak basis data; proyek ini PostgreSQL, jadi berkas
#     itu tidak pernah dimuat saat berjalan — tapi gerbang audit tidak tahu itu, dan
#     kerentanan yang menganggur tetap kerentanan.
overrides:
  sharp: 0.35.3
  fast-uri@3: 3.1.5
  postcss: '>=8.5.12'
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.4
  brace-expansion@5: 5.0.9
  nanoid@3: 3.3.18
  deepmerge-ts: '>=8.0.1'
  browserslist: 4.28.7
  mysql2: 3.22.0
# Audit pnpm memakai rentang datar <=5.0.7 utk advisory ini → ikut menandai salinan v1/v2 yg
# SUDAH patched (false-positive; tak bisa dikecualikan per-path). Instance rentan sejati (v5)
# sudah di-override ke 5.0.8 di atas, jadi GHSA ini nyatanya sudah tertutup di pohon dependensi.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
allowBuilds:
  '@prisma/engines': true
  '@node-rs/argon2': true
  esbuild: true
  exifreader: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - brace-expansion@1.1.18
  - brace-expansion@2.1.4
  - brace-expansion@5.0.9
  - nanoid@3.3.18
  - fast-uri@3.1.5
  - '@aws-sdk/client-s3@3.1086.0'
  - '@aws-sdk/credential-provider-node@3.972.67'
  - '@aws-sdk/s3-request-presigner@3.1086.0'
  - tsx@4.23.1
  - deepmerge-ts@8.0.1
  - browserslist@4.28.7
  - mysql2@3.22.0
