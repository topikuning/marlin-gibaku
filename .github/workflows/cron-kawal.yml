name: Sinkron Kawal KNMP

# Tarikan data lokasi dari Kawal KNMP (aplikasi pengawasan KKP) sebagai
# PEMBANDING progres – rujukan, bukan angka resmi (DECISIONS 689, 690).
#
# Satu putaran = masuk ke Kawal, ambil data SEKALI, simpan snapshot bila isinya
# berubah. Aman dipicu berkali-kali. Tanpa akun Kawal di Sistem › Integrasi =
# tidak melakukan apa-apa. Gagal (akun ditolak, bentuk data Kawal berubah)
# membuat workflow ini merah DAN tercatat di layar Kawal KNMP › Pencocokan.
#
# Perilaku GitHub yang perlu diketahui (sama dengan cron lain): scheduled
# workflow sering telat 5–20 menit, sesekali dilewati, dan DIMATIKAN diam-diam
# bila repo tidak menerima commit selama 60 hari. Tombol "Sinkron sekarang" di
# layar tetap bisa dipakai kapan saja.

on:
  schedule:
    # 23:13 UTC = 06:13 WIB: angka Kawal kemarin sore sudah masuk, dan
    # perbandingannya siap dibaca pagi hari. Menit 13, bukan 0: jadwal tepat
    # di menit 0 paling sering ditunda GitHub.
    - cron: "13 23 * * *"
  workflow_dispatch:

concurrency:
  group: cron-kawal
  cancel-in-progress: false

jobs:
  jalankan:
    name: Panggil /api/cron/kawal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Periksa konfigurasi
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Variable APP_URL belum diisi. Settings → Secrets and variables → Actions → Variables, isi APP_URL = https://<host-produksi> (TANPA garis miring di akhir)."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET belum diisi. Nilainya harus SAMA PERSIS dengan CRON_SECRET di environment aplikasi."
            exit 1
          fi

      - name: Sinkron Kawal
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          status=0
          body=$(curl --fail-with-body -sS -X POST \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 120 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/kawal") || status=$?

          echo "Respons: ${body}"
          if [ "$status" -ne 0 ]; then
            echo "::error::Pemanggilan gagal (curl exit ${status}). Status 404 hampir selalu berarti CRON_SECRET di sini BERBEDA dengan yang ada di aplikasi — endpoint sengaja menjawab 404, bukan 401, supaya keberadaannya tidak bisa dipetakan dari luar."
            exit "$status"
          fi

          # Putaran GAGAL (akun ditolak, bentuk data Kawal berubah) dibuat MERAH
          # di sini supaya GitHub mengirim surel ke pemilik repo – kegagalan
          # yang hanya tercatat di layar mudah tidak terlihat berhari-hari.
          if printf '%s' "$body" | grep -q '"status":"gagal"'; then
            echo "::error::Sinkron Kawal gagal. Sebabnya ada di respons di atas dan di layar Kawal KNMP › Pencocokan."
            exit 1
          fi

          {
            echo "### Sinkron Kawal KNMP"
            echo ""
            echo '```json'
            echo "${body}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
