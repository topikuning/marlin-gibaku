name: Arsip dingin berkas asli MARLIN

# Satu putaran pemindahan BERKAS ASLI foto dari R2 ke mesin sendiri
# (DECISIONS 549).
#
# TIAP JAM, dan sengaja sedikit per putaran: yang menerima adalah mesin di
# rumah/kantor dengan uplink rumahan, bukan pusat data. Menaikkan jumlah per
# putaran akan membuat satu pemanggilan berjalan lama dan gagal di tengah;
# menaikkan FREKUENSI-nya jauh lebih aman. Kalau uplink-nya cuma lega tengah
# malam, ubah jadwal di bawah — KAPAN ia berjalan memang ditentukan di sini,
# bukan di aplikasi.
#
# Sakelar MATI (bawaannya) atau alamat arsip belum diisi = putaran ini tidak
# melakukan apa-apa dan menjawabnya apa adanya. Jadi workflow ini aman
# dinyalakan lebih dulu daripada mesinnya.
#
# Aman dipicu berkali-kali dan bersamaan: tiap langkahnya boleh diulang
# (kirim → periksa → catat; buang → catat), jadi dua putaran yang bertabrakan
# paling buruk mengerjakan berkas yang sama dua kali dengan hasil yang sama.
#
# Perilaku GitHub yang perlu diketahui (sama dengan cron-gdrive): scheduled
# workflow sering telat 5–20 menit, sesekali dilewati, dan DIMATIKAN diam-diam
# bila repo tidak menerima commit selama 60 hari.

on:
  schedule:
    # :40 supaya tidak berebut runner dengan cron-gdrive (:20) dan cron-harian.
    - cron: "40 * * * *"
  # Tombol "Run workflow" di tab Actions — untuk mendorong antrean tanpa
  # menunggu putaran berikutnya. Inilah yang dipakai saat pertama kali
  # menyalakan arsip, supaya hasilnya kelihatan detik itu juga.
  workflow_dispatch:

concurrency:
  group: cron-arsip-asli
  cancel-in-progress: false

jobs:
  jalankan:
    name: Panggil /api/cron/arsip-asli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Periksa konfigurasi
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Variable APP_URL belum diisi. Settings → Secrets and variables → Actions → Variables, isi APP_URL = https://<host-produksi> (TANPA garis miring di akhir)."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET belum diisi. Nilainya harus SAMA PERSIS dengan CRON_SECRET di environment aplikasi."
            exit 1
          fi

      - name: Jalankan satu putaran arsip
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # --fail-with-body: badan respons tetap dicetak walau status error,
          # supaya penyebabnya terbaca di log. Rahasianya hanya ada di header,
          # tidak pernah ikut tercetak.
          status=0
          body=$(curl --fail-with-body -sS -X POST \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 300 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/arsip-asli") || status=$?

          echo "Respons: ${body}"
          if [ "$status" -ne 0 ]; then
            echo "::error::Pemanggilan gagal (curl exit ${status}). Status 404 hampir selalu berarti CRON_SECRET di sini BERBEDA dengan yang ada di aplikasi — endpoint sengaja menjawab 404, bukan 401, supaya keberadaannya tidak bisa dipetakan dari luar."
            exit "$status"
          fi

          {
            echo "### Arsip dingin berkas asli"
            echo ""
            echo '```json'
            echo "${body}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
