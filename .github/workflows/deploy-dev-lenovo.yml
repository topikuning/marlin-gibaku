name: Build and Deploy MARLIN DEV

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: marlin-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: topikuning/marlin-gibaku

jobs:
  build:
    name: Build MARLIN DEV image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MARLIN DEV image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/topikuning/marlin-gibaku:dev
            ghcr.io/topikuning/marlin-gibaku:dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Lenovo DEV
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: lenovo-dev
      url: https://marlin.cacak.xyz

    steps:
      - name: Trigger Lenovo MARLIN DEV deployment
        env:
          DEPLOY_TOKEN: ${{ secrets.MARLIN_DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ vars.MARLIN_DEPLOY_URL }}
        run: |
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::error::MARLIN_DEPLOY_TOKEN belum dikonfigurasi di environment lenovo-dev"
            exit 1
          fi

          if [ -z "${DEPLOY_URL}" ]; then
            echo "::error::MARLIN_DEPLOY_URL belum dikonfigurasi di environment lenovo-dev"
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            --header "X-Marlin-Deploy-Token: ${DEPLOY_TOKEN}" \
            "${DEPLOY_URL}"
