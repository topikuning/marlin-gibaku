name: Pembaruan cuaca satelit MARLIN

# Pembaruan cuaca laporan harian KEMARIN dari pengamatan satelit (awan
# Himawari-9 + hujan JAXA GSMaP), pukul 04.00 WIB (DECISIONS 657).
#
# Pemanggilan ini hanya MEMULAI putaran di latar aplikasi lalu pulang. Sakelar
# MATI, jam belum 04.00 WIB, atau tanggalnya sudah diproses = tidak melakukan
# apa-apa. Aman dipicu berkali-kali.
#
# Perilaku GitHub yang perlu diketahui (sama dengan cron lain): scheduled
# workflow sering telat 5–20 menit, sesekali dilewati, dan DIMATIKAN diam-diam
# bila repo tidak menerima commit selama 60 hari. Yang terlewat disusul oleh
# putaran per jam cron-arsip-asli.

on:
  schedule:
    # 21:02 UTC = 04:02 WIB. Menit 2, bukan 0: jadwal tepat di menit 0 paling
    # sering ditunda GitHub. Kalau terlewat, putaran per jam cron-arsip-asli
    # menyusulnya.
    - cron: "2 21 * * *"
  # Tombol "Run workflow" di tab Actions – menjalankan putaran tanpa menunggu
  # pukul 04.00. Tetap tidak memproses tanggal yang sudah diproses.
  workflow_dispatch:

concurrency:
  group: cron-cuaca
  cancel-in-progress: false

jobs:
  jalankan:
    name: Panggil /api/cron/cuaca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Periksa konfigurasi
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Variable APP_URL belum diisi. Settings → Secrets and variables → Actions → Variables, isi APP_URL = https://<host-produksi> (TANPA garis miring di akhir)."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET belum diisi. Nilainya harus SAMA PERSIS dengan CRON_SECRET di environment aplikasi."
            exit 1
          fi

      - name: Mulai pembaruan cuaca
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # --fail-with-body: badan respons tetap dicetak walau status error,
          # supaya penyebabnya terbaca di log. Rahasianya hanya ada di header,
          # tidak pernah ikut tercetak.
          status=0
          body=$(curl --fail-with-body -sS -X POST \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 300 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/cuaca") || status=$?

          echo "Respons: ${body}"
          if [ "$status" -ne 0 ]; then
            echo "::error::Pemanggilan gagal (curl exit ${status}). Status 404 hampir selalu berarti CRON_SECRET di sini BERBEDA dengan yang ada di aplikasi — endpoint sengaja menjawab 404, bukan 401, supaya keberadaannya tidak bisa dipetakan dari luar."
            exit "$status"
          fi

          {
            echo "### Pembaruan cuaca dari satelit"
            echo ""
            echo '```json'
            echo "${body}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
