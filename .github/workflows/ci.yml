name: CI

on:
  push:
    branches: [main]
  pull_request:

# Batalkan run yang sudah usang: push berikutnya ke PR yang sama membuat run
# sebelumnya tidak relevan. Dikelompokkan per PR (atau per ref untuk push ke
# main), BUKAN per SHA — supaya run commit lama benar-benar dibatalkan.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://marlin:marlin@localhost:5432/marlin_test
  SESSION_SECRET: ci-only-secret-0123456789abcdef-0123456789abcdef
  APP_ENV: test

jobs:
  checks:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack
        run: corepack enable
      - name: Get pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: License audit
        run: node scripts/license-audit.mjs
      - name: Security audit (prod, high+)
        # Tahan-flake: endpoint audit npm kadang mengembalikan respons rusak
        # (ERR_PNPM_AUDIT_BAD_RESPONSE). Retry pada error endpoint; TETAP gagal
        # bila ada kerentanan high+ asli; hanya toleran bila registry benar-benar
        # tak responsif setelah beberapa percobaan (bukan kerentanan).
        run: |
          set +e
          for i in 1 2 3; do
            out="$(pnpm audit --prod --audit-level high 2>&1)"; code=$?
            echo "$out"
            if [ $code -eq 0 ]; then exit 0; fi
            if echo "$out" | grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE"; then
              echo "::warning::Audit endpoint flake (percobaan $i) — retry…"; sleep $((i * 5)); continue
            fi
            echo "::error::Security audit menemukan kerentanan high-severity."; exit "$code"
          done
          echo "::warning::Endpoint audit npm tak responsif setelah retry — dilewati (error registry transient, bukan kerentanan)."
          exit 0
      - name: Prisma generate
        run: pnpm db:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm vitest run tests/unit
      - name: Build
        run: pnpm build

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marlin
          POSTGRES_PASSWORD: marlin
          POSTGRES_DB: marlin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marlin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Migrate + generate
        run: pnpm prisma migrate deploy && pnpm db:generate
      - name: Integration tests
        run: pnpm vitest run tests/integration

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        # Tahan-flake: tarik base image dari Docker Hub kadang timeout jaringan
        # (i/o timeout / DeadlineExceeded) SEBELUM kode kita jalan. Retry HANYA
        # pada error jaringan/registry; TETAP gagal cepat bila build kode gagal.
        run: |
          set +e
          for i in 1 2 3; do
            out="$(docker build --no-cache -t marlin:ci . 2>&1)"; code=$?
            echo "$out"
            if [ $code -eq 0 ]; then exit 0; fi
            if echo "$out" | grep -qiE "i/o timeout|deadlineexceeded|failed to do request|tls handshake timeout|connection reset|temporary failure|timeout awaiting|registry-1\.docker\.io"; then
              echo "::warning::Docker registry/jaringan flake (percobaan $i) — retry…"; sleep $((i * 10)); continue
            fi
            echo "::error::Docker build gagal (bukan flake jaringan)."; exit "$code"
          done
          echo "::error::Docker registry tak responsif setelah retry."; exit 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marlin
          POSTGRES_PASSWORD: marlin
          POSTGRES_DB: marlin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marlin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Migrate + generate + seed
        run: pnpm prisma migrate deploy && pnpm db:generate && pnpm db:seed
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: E2E
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
